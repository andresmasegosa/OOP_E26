# Machine-readable facts about this session's exercises, read by AI
# assistants together with the contract in /AGENTS.md. Students may read it
# too. There is nothing secret here.
id: session3-inheritance-abstract-classes
status: active            # active | closed, changed only by the teaching team
type: practice            # demonstration | practice | assessed
objectives:
  - say which class's method runs when a ChessPiece variable holds a King, a Queen or a Rook, and why
  - share what every piece has through extends and super, and say what a subclass inherits and what it does not
  - override a method, and write @Override above it
  - a superclass with more than one abstract method, each subclass answering both
  - extend an abstract class and implement its abstract method, and read the compiler errors that make abstract classes useful
  - add a type of piece as a subclass, with a constructor that calls super(...), as exercise 1 does with the bishop
  - reuse a superclass's rule through super.isLegalMove, and give a superclass a second, protected constructor for its subclasses, in exercise 2 only, which the sheet marks a stretch goal
  - weigh design choices about the hierarchy in writing, naming what each one costs
  - keep the cost-of-change lines growing with a line for session 3, in the comment at the top of Demo.main
not_yet_introduced:
  - interfaces
  - instanceof and casts
  - sealed classes and permits
  - enums
  - exceptions
  - collections and generics
  - unit tests
  - design patterns
done_when:                # what a complete attempt shows; the tutor confirms against this, not against taste
  exercise0: "the three demo folders A_ to C_ have been run with every printed line predicted beforehand and, for each isLegalMove call, the class whose method runs; every commented line the demo files point at has been uncommented once, its compiler error compared with the one written next to it, and put back; E_ChessGame/Demo has been run and the three differences from session 2, the missing bishops, the changed move 3 and the added seventh move, are written down, with a guess at why the bishops are missing; the two Discussion answers are written down"
  exercise1: "E_ChessGame/Bishop.java extends ChessPiece, overrides both abstract methods, isLegalMove and getLetter, with @Override, and has a constructor that calls super; ChessGame.setupPieces places the four bishops on (0,2), (0,5), (7,2) and (7,5); game.movePiece(7, 5, 5, 3) in Demo.main prints `White Bishop moves (7,5) -> (5,3)` and game.movePiece(7, 2, 5, 2) still prints an Illegal move line, so a rule that answers true to everything is not complete; the three compiler errors, the missing rule, then the missing letter, then the missing constructor, are copied into the notes; a session 3 cost line sits at the top of Demo.main under the two lines from session 2 and says for which places the compiler warned and whether anything showed up only when the program ran; the two Discussion answers are written down"
  exercise2: "knights start on (0,1), (0,6), (7,1) and (7,6), move only in an L, jump over pieces, and Knight.getLetter returns 'N', so the board draws N for White and n for Black; the knight's cost line is written under the bishop's and the legend line of ChessBoard.print names the knight and is counted in the knight's cost line as a place the compiler did not find; Amazon extends Queen, is built through a second, protected Queen constructor that takes the type, so that getType answers Amazon and getLetter answers 'A', uses super.isLegalMove for the queen's part and shares the L with Knight without copying it; an Amazon has been tried on a ChessBoard of its own in Demo.main and her type and symbol printed; the two Discussion answers are written down"
  exercise3: "two written answers, one per question Q1 and Q2, each in the five-line shape (alternative, what it makes better, what it makes worse, what to touch by name, verdict); a verdict of 'not with what I know today' is complete; the wish sentence and the list of what was missing are written down"
allowed_concepts:
  - everything from sessions 1 and 2
  - inheritance with extends, superclasses and subclasses
  - super(...) in a constructor, the order in which constructors run, and constructors not being inherited
  - super.method(...) to call the superclass's version of an overridden method
  - method overriding, the @Override annotation, and dynamic dispatch through a variable of the superclass type
  - why the compiler refuses a call to a method that the declared type of a variable does not have, at the level of the demos
  - abstract classes and abstract methods
  - protected members read and called by a subclass, as in step B_ and chapter 8, and final on classes and methods, as in chapter 7; final is practised by no exercise of this session, and exercise 2 writes a protected constructor
  - Object as the class every class extends, only as far as step A uses it

# Tightens the contract in /AGENTS.md for one exercise. An exception can only
# ever tighten it, never loosen it.
exception: |
  Exercise 3, the design review, is written work, and the writing IS the
  deliverable. For its two questions the general permission to compare
  design options at concept level does not apply: never supply an
  alternative, a benefit, a cost, a list of what would have to change, or a
  verdict, not one of the five lines, and not spread across several replies.
  Explaining what the provided code does is allowed here as everywhere; on the
  questions themselves, ask what the student has written and help them
  sharpen their own words.
